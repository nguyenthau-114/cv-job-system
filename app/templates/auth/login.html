{% extends "layouts/base.html" %}

{% block title %}Đăng nhập - JobFit{% endblock %}

{% block content %}
<section class="auth-page py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">

                <!-- Card đăng nhập chính -->
                <div class="card auth-card auth-card-sm border-0 shadow rounded-4 overflow-hidden">

                    <!-- Header xanh pastel -->
                    <div class="auth-card-header text-center px-4 py-4">

                        <!-- Logo JobFit -->
                        <img src="{{ url_for('static', filename='images/jobfit-logo.png') }}" alt="JobFit Logo"
                            width="72" height="72" class="object-fit-contain mb-3">

                        <h1 class="h3 fw-bold mb-2">Đăng nhập</h1>

                        <p class="text-secondary mb-0">
                            Chào mừng quay trở lại
                        </p>
                    </div>

                    <!-- Form đăng nhập -->
                    <div class="card-body bg-white p-4 p-md-5 pt-md-4">
                        <form method="POST" action="{{ url_for('auth.login') }}">

                            <!-- CSRF bảo vệ form -->
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">
                                    Email
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text bg-white">
                                        <i class="bi bi-envelope"></i>
                                    </span>

                                    <input type="email" class="form-control form-control-lg" id="email" name="email"
                                        value="{{ email or '' }}" placeholder="Nhập email" required>
                                </div>
                            </div>

                            <!-- Mật khẩu -->
                            <div class="mb-2">
                                <div class="d-flex justify-content-between align-items-center">
                                    <label for="password" class="form-label fw-semibold">
                                        Mật khẩu
                                    </label>

                                    <a href="{{ url_for('auth.forgot_password') }}"
                                        class="auth-link small text-decoration-none fw-medium">
                                        Quên mật khẩu?
                                    </a>
                                </div>

                                <div class="input-group">
                                    <span class="input-group-text bg-white">
                                        <i class="bi bi-lock"></i>
                                    </span>

                                    <input type="password" class="form-control form-control-lg border-end-0"
                                        id="password" name="password" placeholder="Nhập mật khẩu" required>

                                    <!-- Hiện/ẩn mật khẩu -->
                                    <button type="button" class="input-group-text bg-white password-toggle"
                                        onclick="togglePassword('password', this)" aria-label="Hiển thị mật khẩu">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Nút đăng nhập -->
                            <button type="submit" class="btn btn-primary btn-lg w-100 mt-4 fw-semibold">
                                Đăng nhập
                            </button>
                        </form>

                        <!-- Chuyển sang đăng ký -->
                        <div class="text-center mt-4">
                            <span class="text-secondary">
                                Chưa có tài khoản?
                            </span>
                            <a href="{{ url_for('auth.register') }}"
                                class="auth-link text-decoration-none fw-semibold ms-1">
                                Đăng ký
                            </a>
                        </div>

                    </div>
                </div>

                <!-- Thông điệp bên dưới -->
                <p class="text-center text-secondary small mt-3 mb-0">
                    Tìm việc IT phù hợp hơn với kỹ năng trong CV của bạn.
                </p>

            </div>
        </div>
    </div>
</section>
{% endblock %}


{% block scripts %}
<script>
    // Hiện/ẩn mật khẩu và thay đổi icon mắt
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        const icon = button.querySelector("i");
        const isHidden = input.type === "password";

        input.type = isHidden ? "text" : "password";
        icon.className = isHidden ? "bi bi-eye-slash" : "bi bi-eye";

        button.setAttribute(
            "aria-label",
            isHidden ? "Ẩn mật khẩu" : "Hiển thị mật khẩu"
        );
    }
</script>
{% endblock %}
