{% extends "layouts/base.html" %}

{% block title %}Đăng ký - JobFit{% endblock %}

{% block content %}
<section class="auth-page py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8 col-xl-7">

                <!-- Card đăng ký -->
                <div class="card auth-card border-0 shadow rounded-4 overflow-hidden">

                    <!-- Header xanh pastel -->
                    <div class="auth-card-header text-center px-4 py-4">

                        <!-- Logo JobFit -->
                        <img src="{{ url_for('static', filename='images/jobfit-logo.png') }}" alt="JobFit Logo"
                            width="72" height="72" class="object-fit-contain mb-3">

                        <h1 class="h3 fw-bold mb-2">Đăng ký</h1>

                        <p class="text-secondary mb-0">
                            Tạo tài khoản để bắt đầu sử dụng JobFit
                        </p>
                    </div>

                    <!-- Nội dung form -->
                    <div class="card-body bg-white p-4 p-md-5">

                        <form method="POST" action="{{ url_for('auth.register') }}">

                            <!-- CSRF bảo vệ form -->
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <!-- Chọn vai trò -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold mb-2">
                                    Bạn đăng ký với tư cách <span class="text-danger">*</span>
                                </label>

                                <div class="d-flex gap-4">

                                    <!-- Ứng viên -->
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="role" id="candidate"
                                            value="CANDIDATE" {% if role | default('CANDIDATE')=='CANDIDATE' %}checked{%
                                            endif %} required>

                                        <label class="form-check-label" for="candidate">
                                            Ứng viên
                                        </label>
                                    </div>

                                    <!-- Nhà tuyển dụng -->
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="role" id="recruiter"
                                            value="RECRUITER" {% if role | default('CANDIDATE')=='RECRUITER' %}checked{%
                                            endif %}>

                                        <label class="form-check-label" for="recruiter">
                                            Nhà tuyển dụng
                                        </label>
                                    </div>

                                </div>
                            </div>

                            <div class="row g-3">

                                <!-- Họ và tên -->
                                <div class="col-md-6">
                                    <label for="user_name" class="form-label fw-semibold">
                                        Họ và tên
                                    </label>

                                    <div class="input-group">
                                        <span class="input-group-text bg-white">
                                            <i class="bi bi-person"></i>
                                        </span>

                                        <input type="text" class="form-control" id="user_name" name="user_name"
                                            value="{{ user_name | default('') }}" placeholder="Nhập họ và tên" required>
                                    </div>
                                </div>

                                <!-- Số điện thoại -->
                                <div class="col-md-6">
                                    <label for="phone" class="form-label fw-semibold">
                                        Số điện thoại
                                        <span class="text-secondary fw-normal small">
                                            (không bắt buộc)
                                        </span>
                                    </label>

                                    <div class="input-group">
                                        <span class="input-group-text bg-white">
                                            <i class="bi bi-telephone"></i>
                                        </span>

                                        <input type="tel" class="form-control" id="phone" name="phone"
                                            value="{{ phone | default('') }}" placeholder="Nhập số điện thoại">
                                    </div>
                                </div>

                                <!-- Email -->
                                <div class="col-12">
                                    <label for="email" class="form-label fw-semibold">
                                        Email
                                    </label>

                                    <div class="input-group">
                                        <span class="input-group-text bg-white">
                                            <i class="bi bi-envelope"></i>
                                        </span>

                                        <input type="email" class="form-control" id="email" name="email"
                                            value="{{ email | default('') }}" placeholder="Nhập email" required>
                                    </div>
                                </div>

                                <!-- Mật khẩu -->
                                <div class="col-md-6">
                                    <label for="password" class="form-label fw-semibold">
                                        Mật khẩu
                                    </label>

                                    <div class="input-group">
                                        <span class="input-group-text bg-white">
                                            <i class="bi bi-lock"></i>
                                        </span>

                                        <input type="password" class="form-control border-end-0" id="password"
                                            name="password" placeholder="Nhập mật khẩu" minlength="8" required>

                                        <button type="button" class="input-group-text bg-white password-toggle"
                                            onclick="togglePassword('password', this)" aria-label="Hiển thị mật khẩu">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                </div>

                                <!-- Xác nhận mật khẩu -->
                                <div class="col-md-6">
                                    <label for="confirm_password" class="form-label fw-semibold">
                                        Xác nhận mật khẩu
                                    </label>

                                    <div class="input-group">
                                        <span class="input-group-text bg-white">
                                            <i class="bi bi-lock-fill"></i>
                                        </span>

                                        <input type="password" class="form-control border-end-0" id="confirm_password"
                                            name="confirm_password" placeholder="Nhập lại mật khẩu" minlength="8"
                                            required>

                                        <button type="button" class="input-group-text bg-white password-toggle"
                                            onclick="togglePassword('confirm_password', this)"
                                            aria-label="Hiển thị mật khẩu">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                </div>

                            </div>

                            <!-- Yêu cầu mật khẩu -->
                            <div class="d-flex align-items-start gap-2 mt-3 text-secondary small">
                                <i class="bi bi-info-circle mt-1"></i>
                                <span>
                                    Mật khẩu tối thiểu 8 ký tự, gồm chữ hoa,
                                    chữ thường và chữ số.
                                </span>
                            </div>

                            <!-- Nút đăng ký -->
                            <button type="submit" class="btn btn-primary btn-lg w-100 mt-4 fw-semibold">
                                Đăng ký
                            </button>
                        </form>

                        <!-- Chuyển sang đăng nhập -->
                        <div class="text-center mt-4">
                            <span class="text-secondary">
                                Đã có tài khoản?
                            </span>

                            <a href="{{ url_for('auth.login') }}"
                                class="auth-link text-decoration-none fw-semibold ms-1">
                                Đăng nhập
                            </a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
</section>
{% endblock %}


{% block scripts %}
<script>
    // Hiện/ẩn mật khẩu và thay đổi icon mắt
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        const icon = button.querySelector("i");
        const isHidden = input.type === "password";

        input.type = isHidden ? "text" : "password";
        icon.className = isHidden ? "bi bi-eye-slash" : "bi bi-eye";

        button.setAttribute(
            "aria-label",
            isHidden ? "Ẩn mật khẩu" : "Hiển thị mật khẩu"
        );
    }
</script>
{% endblock %}
